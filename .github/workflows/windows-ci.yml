name: Windows CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "redesign/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feat/**"
      - "redesign/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: 2.2.0.${{ github.run_number }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 LTS SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404

      - name: Show SDK information
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore .\SkyLyrics.sln

      - name: Build Release solution
        run: dotnet build .\SkyLyrics.sln --configuration Release --no-restore -p:Version=${{ env.APP_VERSION }} -p:FileVersion=${{ env.APP_VERSION }} -p:InformationalVersion=${{ env.APP_VERSION }}+${{ github.sha }}

      - name: Run unit tests
        run: >-
          dotnet test .\tests\SkyLyrics.Tests\SkyLyrics.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=SkyLyrics.Tests.trx"
          --results-directory .\TestResults

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Publish self-contained Windows x64 application
        run: >-
          dotnet publish .\src\SkyLyrics.Desktop\SkyLyrics.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output .\publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:Version=${{ env.APP_VERSION }}
          -p:FileVersion=${{ env.APP_VERSION }}
          -p:InformationalVersion=${{ env.APP_VERSION }}+${{ github.sha }}

      - name: Compile Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\artifacts | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ env.APP_VERSION }}" .\installer\windows\SkyLyrics.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Verify installer and generate SHA-256
        shell: pwsh
        run: |
          $installer = Get-ChildItem .\artifacts\SkyLyricsDesktop-Setup-win-x64-*.exe | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -lt 1MB) {
            throw "Versioned installer is missing or unexpectedly small."
          }
          $app = Get-Item .\publish\SkyLyrics.Desktop.exe
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content .\artifacts\SHA256SUMS.txt -Encoding ascii
          [ordered]@{
            version = "${{ env.APP_VERSION }}"
            commit = "${{ github.sha }}"
            workflowRun = ${{ github.run_number }}
            appBytes = $app.Length
            installerBytes = $installer.Length
            sha256 = $hash
          } | ConvertTo-Json -Depth 4 | Set-Content .\artifacts\BuildManifest.json -Encoding utf8
          Write-Host "Application EXE size: $($app.Length) bytes"
          Write-Host "Installer size: $($installer.Length) bytes"
          Write-Host "Version: ${{ env.APP_VERSION }}"
          Write-Host "SHA-256: $hash"

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: skylyrics-windows-x64-installer
          path: .\artifacts\*
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skylyrics-windows-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn