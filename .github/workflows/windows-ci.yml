name: Windows CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 LTS SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404

      - name: Show SDK information
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore .\SkyLyrics.sln

      - name: Build Release solution
        run: dotnet build .\SkyLyrics.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test .\tests\SkyLyrics.Tests\SkyLyrics.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=SkyLyrics.Tests.trx"
          --results-directory .\TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skylyrics-windows-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
