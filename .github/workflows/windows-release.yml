name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build, test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      APP_VERSION: 2.2.0-preview.1

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = "2.2.0-preview.1"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF.Substring(11)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([\-+][0-9A-Za-z\.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Restore solution
        run: dotnet restore .\SkyLyrics.sln

      - name: Release build
        run: >-
          dotnet build .\SkyLyrics.sln
          --configuration Release
          --no-restore
          -p:Version=$env:APP_VERSION
          -p:FileVersion=$env:APP_VERSION
          -p:InformationalVersion="$($env:APP_VERSION)+$($env:GITHUB_SHA)"

      - name: Run unit tests
        run: dotnet test .\tests\SkyLyrics.Tests\SkyLyrics.Tests.csproj --configuration Release --no-build --no-restore

      - name: Publish self-contained Windows x64 application
        run: >-
          dotnet publish .\src\SkyLyrics.Desktop\SkyLyrics.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output .\publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:Version=$env:APP_VERSION
          -p:FileVersion=$env:APP_VERSION
          -p:InformationalVersion="$($env:APP_VERSION)+$($env:GITHUB_SHA)"

      - name: Verify application executable
        shell: pwsh
        run: |
          if (!(Test-Path .\publish\SkyLyrics.Desktop.exe)) {
            throw "SkyLyrics.Desktop.exe was not published."
          }

      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\artifacts | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" .\installer\windows\SkyLyrics.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Verify installer and generate SHA-256 checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem .\artifacts\SkyLyricsDesktop-Setup-win-x64-$env:APP_VERSION.exe -File)
          if ($installers.Count -ne 1 -or $installers[0].Length -lt 1MB) {
            throw "Versioned Windows installer is missing or unexpectedly small."
          }
          $installer = $installers[0]
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content .\artifacts\SHA256SUMS.txt -Encoding ascii
          [ordered]@{
            version = $env:APP_VERSION
            commit = $env:GITHUB_SHA
            installerBytes = $installer.Length
            sha256 = $hash
          } | ConvertTo-Json -Depth 4 | Set-Content .\artifacts\BuildManifest.json -Encoding utf8

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: skylyrics-windows-x64-installer
          path: .\artifacts\*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/SkyLyricsDesktop-Setup-win-x64-*.exe
            artifacts/SHA256SUMS.txt
            artifacts/BuildManifest.json
