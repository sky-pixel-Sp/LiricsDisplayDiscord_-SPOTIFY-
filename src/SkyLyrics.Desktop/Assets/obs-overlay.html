<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyLyrics OBS Overlay</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
#stage{position:absolute;left:5%;right:5%;bottom:7%;padding:28px 34px;border:1px solid rgba(131,225,210,.28);border-radius:22px;background:linear-gradient(110deg,rgba(8,15,22,.90),rgba(15,27,36,.72));color:#f1f6f7;box-shadow:0 18px 64px rgba(0,0,0,.26);backdrop-filter:blur(18px)}
#brand{font-size:12px;font-weight:700;letter-spacing:.22em;color:#83e1d2}
#track{margin-top:9px;font-size:16px;color:#a9bac4}
#line{margin-top:20px;font-size:clamp(26px,4.2vw,58px);line-height:1.18;font-weight:650;min-height:1.2em;text-wrap:balance;transition:opacity .18s ease,transform .18s ease}
#word{margin-top:12px;font-size:18px;font-weight:650;color:#83e1d2}
#footer{display:flex;justify-content:space-between;gap:20px;margin-top:20px;font-size:11px;letter-spacing:.08em;color:#9aabb5}
#status{color:#83e1d2}
@media(prefers-reduced-motion:reduce){#line{transition:none}}
</style>
</head>
<body>
<section id="stage" aria-live="polite">
  <div id="brand">SKYLYRICS · LIVE SYNC</div>
  <div id="track"></div>
  <div id="line"></div>
  <div id="word"></div>
  <div id="footer"><span id="status">WAITING FOR PLAYBACK</span><span id="position">00:00</span></div>
</section>
<script>
const byId=id=>document.getElementById(id);
let lastRevision=-1;
async function refresh(){
  try{
    const response=await fetch("/state",{cache:"no-store"});
    if(!response.ok)throw new Error("Overlay state unavailable");
    const state=await response.json();
    byId("track").textContent=[state.title,state.artist].filter(Boolean).join(" · ");
    if(state.revision!==lastRevision){
      byId("line").style.opacity="0.35";
      byId("line").style.transform="translateY(5px)";
      requestAnimationFrame(()=>{byId("line").textContent=state.currentLine||"";byId("line").style.opacity="1";byId("line").style.transform="translateY(0)";});
      lastRevision=state.revision;
    }
    byId("word").textContent=state.activeWord||"";
    byId("status").textContent=(state.playbackStatus||"Unknown").toUpperCase();
    byId("position").textContent=state.position||"00:00";
  }catch{
    byId("status").textContent="SKYLYRICS NOT CONNECTED";
  }
}
refresh();
setInterval(refresh,400);
</script>
</body>
</html>
